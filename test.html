<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>性别测试 - Gender Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      background: #0f0f23; color: #ffffff;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; position: relative; image-rendering: pixelated;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    }

    /* LANDING */
    #landing {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem 1.5rem;
      opacity: 1; transform: scale(1);
      transition: opacity 0.5s ease, transform 0.5s ease;
      width: 100%; max-width: 600px;
    }
    #landing.is-hidden { opacity: 0; transform: scale(0.8); pointer-events: none; }
    .main-title {
      font-size: clamp(1.5rem, 6vw, 2.8rem); color: #ffffff;
      text-shadow: 3px 3px 0 #4a4a6a, -1px -1px 0 #4a4a6a, 1px -1px 0 #4a4a6a, -1px 1px 0 #4a4a6a, 0 0 20px rgba(240,219,79,0.3);
      margin-bottom: 0.75rem; line-height: 1.4;
      animation: titlePulse 3s ease-in-out infinite;
    }
    @keyframes titlePulse { 0%,100% { text-shadow: 3px 3px 0 #4a4a6a, 0 0 20px rgba(240,219,79,0.3); } 50% { text-shadow: 3px 3px 0 #4a4a6a, 0 0 40px rgba(240,219,79,0.6); } }
    .sub-title { font-size: clamp(0.7rem, 2.5vw, 1rem); color: #b0b0c8; text-shadow: 2px 2px 0 #3a3a5a; margin-bottom: 3rem; line-height: 1.6; }

    /* MYSTERY BLOCK */
    .mystery-block {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 120px; height: 120px; background: #f0db4f; border: none; cursor: pointer;
      font-family: 'Press Start 2P', 'Courier New', monospace; font-size: 2.5rem; color: #8b6914; text-shadow: 1px 1px 0 #fff3a0;
      box-shadow: 4px 0 0 0 #8b6914, -4px 0 0 0 #8b6914, 0 4px 0 0 #8b6914, 0 -4px 0 0 #8b6914, 2px 2px 0 0 rgba(255,255,255,0.3) inset, -2px -2px 0 0 rgba(0,0,0,0.15) inset, 8px 8px 0 0 rgba(0,0,0,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      animation: blockFloat 3s ease-in-out infinite;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .mystery-block::before { content: ''; position: absolute; inset: -8px; background: transparent; box-shadow: 4px 0 0 0 #5a4510, -4px 0 0 0 #5a4510, 0 4px 0 0 #5a4510, 0 -4px 0 0 #5a4510; pointer-events: none; }
    .mystery-block .block-icon { position: relative; z-index: 1; line-height: 1; }
    .mystery-block .block-dots { position: absolute; inset: 0; pointer-events: none; }
    .mystery-block .block-dots::before, .mystery-block .block-dots::after { content: ''; position: absolute; width: 8px; height: 8px; background: #c9a830; box-shadow: 1px 1px 0 0 #8b6914; }
    .mystery-block .block-dots::before { top: 14px; left: 14px; }
    .mystery-block .block-dots::after { bottom: 14px; right: 14px; }
    @keyframes blockFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .mystery-block:hover { transform: translateY(-8px) scale(1.05); box-shadow: 4px 0 0 0 #8b6914, -4px 0 0 0 #8b6914, 0 4px 0 0 #8b6914, 0 -4px 0 0 #8b6914, 2px 2px 0 0 rgba(255,255,255,0.4) inset, -2px -2px 0 0 rgba(0,0,0,0.15) inset, 8px 8px 0 0 rgba(0,0,0,0.4), 0 0 30px rgba(240,219,79,0.5); animation: blockBounce 0.4s ease infinite; }
    @keyframes blockBounce { 0%,100% { transform: translateY(-8px) scale(1.05); } 50% { transform: translateY(-12px) scale(1.05); } }
    .mystery-block:active { transform: translateY(4px) scale(0.95); box-shadow: 4px 0 0 0 #8b6914, -4px 0 0 0 #8b6914, 0 4px 0 0 #8b6914, 0 -4px 0 0 #8b6914, 2px 2px 0 0 rgba(0,0,0,0.2) inset, -2px -2px 0 0 rgba(255,255,255,0.1) inset, 4px 4px 0 0 rgba(0,0,0,0.4); animation: none; }
    .btn-label { margin-top: 1.5rem; font-size: 0.65rem; color: #8888aa; text-shadow: 1px 1px 0 #2a2a4a; letter-spacing: 0.15em; animation: labelBlink 2s step-end infinite; }
    @keyframes labelBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* QUIZ MODAL */
    #quiz-modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1.25rem; background: rgba(15,15,35,0.92); backdrop-filter: blur(4px); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.4s ease, visibility 0.4s ease; }
    #quiz-modal.is-open { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal-box { position: relative; width: min(100%, 560px); padding: 2.5rem 2rem 2rem; background: #1a1a3e; border: 4px solid #f0db4f; box-shadow: 8px 8px 0 0 rgba(0,0,0,0.5), inset 2px 2px 0 0 rgba(255,255,255,0.08), inset -2px -2px 0 0 rgba(0,0,0,0.2); transform: scale(0.85) translateY(20px); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s ease; opacity: 0; overflow: hidden; }
    #quiz-modal.is-open .modal-box { transform: scale(1) translateY(0); opacity: 1; }
    .modal-box::before { content: ''; position: absolute; inset: -8px; background: transparent; box-shadow: 4px 0 0 0 #8b6914, -4px 0 0 0 #8b6914, 0 4px 0 0 #8b6914, 0 -4px 0 0 #8b6914; pointer-events: none; z-index: 5; }
    .modal-close { position: absolute; top: 12px; right: 12px; z-index: 10; width: 36px; height: 36px; background: #3a3a5a; border: 3px solid #5a5a7a; color: #b0b0c8; font-family: 'Press Start 2P', monospace; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease, border-color 0.2s ease; box-shadow: 3px 3px 0 0 rgba(0,0,0,0.4); line-height: 1; }
    .modal-close:hover { background: #5a5a7a; border-color: #f0db4f; color: #f0db4f; }
    .modal-close:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 0 rgba(0,0,0,0.4); }

    /* QUESTION SLIDE */
    .question-slide { opacity: 0; transform: translateX(40px); transition: opacity 0.35s ease, transform 0.35s ease; }
    .question-slide.is-active { opacity: 1; transform: translateX(0); }
    .question-slide.is-exit-left { opacity: 0; transform: translateX(-40px); }
    .modal-question-number { font-size: 0.55rem; color: #f0db4f; margin-bottom: 0.75rem; text-shadow: 1px 1px 0 #5a4510; }
    .modal-question-text { font-size: clamp(0.6rem, 2vw, 0.8rem); line-height: 1.8; color: #e0e0f0; margin-bottom: 1.5rem; text-shadow: 1px 1px 0 #2a2a4a; min-height: 2.5em; }

    /* OPTIONS */
    .options-grid { display: flex; flex-direction: column; gap: 0.7rem; }
    .option-btn { display: flex; align-items: center; gap: 0.75rem; width: 100%; padding: 0.85rem 1.1rem; background: #2a2a5a; border: 3px solid #4a4a7a; color: #c0c0e0; font-family: 'Press Start 2P', 'Courier New', monospace; font-size: clamp(0.45rem, 1.5vw, 0.6rem); cursor: pointer; text-align: left; transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease; box-shadow: 4px 4px 0 0 rgba(0,0,0,0.4); line-height: 1.4; position: relative; overflow: hidden; }
    .option-btn:hover { background: #3a3a7a; border-color: #f0db4f; color: #ffffff; transform: translate(-2px,-2px); box-shadow: 6px 6px 0 0 rgba(0,0,0,0.4); }
    .option-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 0 rgba(0,0,0,0.4); }
    .option-btn.is-disabled { pointer-events: none; opacity: 0.6; }
    .option-letter { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; background: #4a4a7a; border: 2px solid #6a6a9a; color: #f0db4f; font-size: 0.65rem; flex-shrink: 0; box-shadow: 2px 2px 0 0 rgba(0,0,0,0.3); }
    .option-btn:hover .option-letter { background: #f0db4f; border-color: #8b6914; color: #5a4510; }

    /* PIXEL EXPLOSION */
    .pixel-particle { position: fixed; z-index: 200; pointer-events: none; width: 8px; height: 8px; image-rendering: pixelated; animation: particleFly 0.7s ease-out forwards; }
    @keyframes particleFly { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); } }

    /* RESULT SCREEN */
    #result-screen { position: fixed; inset: 0; z-index: 150; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; background: rgba(10,10,30,0.97); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.6s ease, visibility 0.6s ease; }
    #result-screen.is-open { opacity: 1; visibility: visible; pointer-events: auto; }
    .result-box { width: min(100%, 520px); padding: 2.5rem 2rem 2rem; background: #1a1a3e; border: 4px solid #f0db4f; box-shadow: 8px 8px 0 0 rgba(0,0,0,0.5), 0 0 40px rgba(240,219,79,0.15); text-align: center; transform: scale(0.8); transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1); position: relative; }
    .result-box::before { content: ''; position: absolute; inset: -8px; background: transparent; box-shadow: 4px 0 0 0 #8b6914, -4px 0 0 0 #8b6914, 0 4px 0 0 #8b6914, 0 -4px 0 0 #8b6914; pointer-events: none; }
    #result-screen.is-open .result-box { transform: scale(1); }
    .result-badge { font-size: 0.5rem; color: #f0db4f; margin-bottom: 0.75rem; text-shadow: 1px 1px 0 #5a4510; letter-spacing: 0.2em; }

    /* TREASURE BOX */
    .treasure-box-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 1.5rem; cursor: pointer; }
    .treasure-box { position: absolute; inset: 0; background: #f0db4f; box-shadow: 4px 0 0 0 #8b6914, -4px 0 0 0 #8b6914, 0 4px 0 0 #8b6914, 0 -4px 0 0 #8b6914, 2px 2px 0 0 rgba(255,255,255,0.3) inset, -2px -2px 0 0 rgba(0,0,0,0.15) inset; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #8b6914; transition: transform 0.4s ease; z-index: 2; }
    .treasure-box.is-open { transform: translateY(-30px) scale(1.1); box-shadow: 4px 0 0 0 #8b6914, -4px 0 0 0 #8b6914, 0 4px 0 0 #8b6914, 0 -4px 0 0 #8b6914, 2px 2px 0 0 rgba(255,255,255,0.3) inset, -2px -2px 0 0 rgba(0,0,0,0.15) inset, 0 0 30px rgba(240,219,79,0.5); }
    .treasure-lid { position: absolute; top: -30px; left: -4px; right: -4px; height: 34px; background: #e5c83a; box-shadow: 4px 0 0 0 #8b6914, -4px 0 0 0 #8b6914, 0 4px 0 0 #8b6914, 2px 2px 0 0 rgba(255,255,255,0.3) inset; transform-origin: bottom center; transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1); z-index: 3; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #8b6914; }
    .treasure-lid.is-open { transform: rotateX(-120deg) translateY(-10px); }
    .treasure-glow { position: absolute; inset: -20px; background: radial-gradient(circle, rgba(240,219,79,0.3), transparent 70%); opacity: 0; transition: opacity 0.8s ease; pointer-events: none; }
    .treasure-glow.is-open { opacity: 1; animation: glowPulse 1.5s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

    .result-title { font-size: clamp(0.8rem, 3vw, 1.2rem); color: #ffffff; text-shadow: 2px 2px 0 #4a4a6a; margin-bottom: 0.5rem; line-height: 1.5; }
    .result-subtitle { font-size: clamp(0.5rem, 1.8vw, 0.7rem); color: #f0db4f; text-shadow: 1px 1px 0 #5a4510; margin-bottom: 1.5rem; }
    .result-description { font-size: clamp(0.45rem, 1.5vw, 0.6rem); color: #b0b0c8; line-height: 1.8; margin-bottom: 1.5rem; text-shadow: 1px 1px 0 #2a2a4a; }
    .result-stats { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 1.5rem; }
    .result-stat { text-align: center; }
    .result-stat-value { font-size: 1.2rem; color: #f0db4f; text-shadow: 2px 2px 0 #5a4510; }
    .result-stat-label { font-size: 0.4rem; color: #8888aa; margin-top: 0.3rem; }
    .result-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 1.5rem; background: #f0db4f; border: 3px solid #8b6914; color: #5a4510; font-family: 'Press Start 2P', 'Courier New', monospace; font-size: 0.55rem; cursor: pointer; box-shadow: 4px 4px 0 0 rgba(0,0,0,0.4); transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .result-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 0 rgba(0,0,0,0.4); }
    .result-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 0 rgba(0,0,0,0.4); }

    /* HUMOR POPUP */
    #humor-popup { position: fixed; inset: 0; z-index: 250; display: flex; align-items: center; justify-content: center; padding: 1.25rem; background: rgba(0,0,0,0.85); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.4s ease, visibility 0.4s ease; }
    #humor-popup.is-open { opacity: 1; visibility: visible; pointer-events: auto; }
    .humor-box { width: min(100%, 480px); padding: 2rem 1.75rem; background: #1a1a3e; border: 4px solid #f0db4f; box-shadow: 8px 8px 0 0 rgba(0,0,0,0.5); text-align: center; transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); position: relative; }
    .humor-box::before { content: ''; position: absolute; inset: -8px; background: transparent; box-shadow: 4px 0 0 0 #8b6914, -4px 0 0 0 #8b6914, 0 4px 0 0 #8b6914, 0 -4px 0 0 #8b6914; pointer-events: none; }
    #humor-popup.is-open .humor-box { transform: scale(1); }
    .humor-icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .humor-text { font-size: clamp(0.5rem, 2vw, 0.7rem); line-height: 1.8; color: #e0e0f0; margin-bottom: 1.5rem; text-shadow: 1px 1px 0 #2a2a4a; }
    .humor-btn { padding: 0.75rem 1.5rem; background: #f0db4f; border: 3px solid #8b6914; color: #5a4510; font-family: 'Press Start 2P', 'Courier New', monospace; font-size: 0.5rem; cursor: pointer; box-shadow: 4px 4px 0 0 rgba(0,0,0,0.4); transition: transform 0.15s ease; }
    .humor-btn:hover { transform: translate(-2px,-2px); }
    .humor-btn:active { transform: translate(2px,2px); }

    @media (max-width: 480px) {
      .mystery-block { width: 90px; height: 90px; font-size: 1.8rem; }
      .mystery-block .block-dots::before, .mystery-block .block-dots::after { width: 6px; height: 6px; }
      .mystery-block .block-dots::before { top: 10px; left: 10px; }
      .mystery-block .block-dots::after { bottom: 10px; right: 10px; }
      .modal-box { padding: 1.75rem 1.25rem 1.5rem; }
      .option-btn { padding: 0.65rem 0.85rem; }
      .result-box { padding: 1.75rem 1.25rem; }
      .result-stats { gap: 1rem; }
    }
    @media (max-width: 360px) { .main-title { font-size: 1.1rem; } .sub-title { font-size: 0.55rem; } }
  </style>
</head>
<body>

  <!-- LANDING -->

          ],
          w: { A: { f: 3, m: 0 }, B: { f: 0, m: 3 }, C: { f: 1, m: 2 }, D: { f: 0, m: 2 } }
        },
        {
          q: 'Q7: 看到流星许什么愿？',
          options: [
            { label: 'A', text: '考试全过' },
            { label: 'B', text: '一夜暴富' },
            { label: 'C', text: '世界和平 + 涨工资' },
            { label: 'D', text: '再来更多流星' }
          ],
          w: { A: { f: 2, m: 1 }, B: { f: 0, m: 2 }, C: { f: 2, m: 1 }, D: { f: 0, m: 3 } }
        },
        {
          q: 'Q8: 遇到马里奥你会？',
          options: [
            { label: 'A', text: '给他蘑菇' },
            { label: 'B', text: '请他吃麻辣烫' },
            { label: 'C', text: '教他Python' },
            { label: 'D', text: '帮他找公主' }
          ],
          w: { A: { f: 2, m: 1 }, B: { f: 2, m: 1 }, C: { f: 0, m: 3 }, D: { f: 1, m: 2 } }
        },
        {
          q: 'Q9: 实验室选哪个装备？',
          options: [
            { label: 'A', text: '烧杯' },
            { label: 'B', text: '移液枪' },
            { label: 'C', text: '离心机' },
            { label: 'D', text: '本生灯' }
          ],
          w: { A: { f: 2, m: 1 }, B: { f: 2, m: 1 }, C: { f: 1, m: 2 }, D: { f: 0, m: 3 } }
        },
        {
          q: 'Q10: 你是：',
          options: [
            { label: 'F', text: '♀ 女性' },
            { label: 'M', text: '♂ 男性' }
          ],
          w: { F: { f: 3, m: 0 }, M: { f: 0, m: 3 } }
        }
      ];

      // ===== DOM REFS =====
      var landing = document.getElementById('landing');
      var startBtn = document.getElementById('start-btn');
      var quizModal = document.getElementById('quiz-modal');
      var modalClose = document.getElementById('modal-close');
      var questionSlide = document.getElementById('question-slide');
      var questionNumber = document.getElementById('modal-question-number');
      var questionText = document.getElementById('modal-question-text');
      var optionsGrid = document.getElementById('options-grid');
      var resultScreen = document.getElementById('result-screen');
      var treasureBox = document.getElementById('treasure-box');
      var treasureLid = document.getElementById('treasure-lid');
      var treasureGlow = document.getElementById('treasure-glow');
      var resultTitle = document.getElementById('result-title');
      var resultSubtitle = document.getElementById('result-subtitle');
      var resultDesc = document.getElementById('result-description');
      var statFemale = document.getElementById('stat-female');
      var statMale = document.getElementById('stat-male');
      var resultHumorBtn = document.getElementById('result-humor-btn');
      var humorPopup = document.getElementById('humor-popup');
      var humorText = document.getElementById('humor-text');
      var humorCloseBtn = document.getElementById('humor-close-btn');

      // ===== STATE =====
      var currentQ = 0;
      var totalF = 0;
      var totalM = 0;
      var isTransitioning = false;

      // ===== HELPERS =====
      function shuffleArray(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
        return arr;
      }

      function createPixelExplosion(x, y) {
        var colors = ['#f0db4f', '#ff6b6b', '#4ecdc4', '#45b7d1', '#ff9ff3', '#feca57', '#ff6348', '#7bed9f'];
        for (var i = 0; i < 16; i++) {
          var p = document.createElement('div');
          p.className = 'pixel-particle';
          var angle = (Math.PI * 2 / 16) * i + (Math.random() - 0.5) * 0.5;
          var dist = 60 + Math.random() * 80;
          p.style.left = (x - 4) + 'px';
          p.style.top = (y - 4) + 'px';
          p.style.background = colors[Math.floor(Math.random() * colors.length)];
          p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
          p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
          p.style.width = (6 + Math.random() * 6) + 'px';
          p.style.height = p.style.width;
          document.body.appendChild(p);
          setTimeout(function(el) { el.remove(); }, 800, p);
        }
      }

      // ===== RENDER QUESTION =====
      function renderQuestion(index) {
        var q = questions[index];
        if (!q) return;
        questionNumber.textContent = 'Q' + (index + 1) + ' / 10';
        questionText.textContent = q.q;

        // Special styling for Q10
        if (index === 9) {
          questionText.style.fontSize = 'clamp(0.8rem, 3vw, 1.2rem)';
          questionText.style.color = '#f0db4f';
          questionText.style.textShadow = '2px 2px 0 #5a4510, 0 0 20px rgba(240,219,79,0.3)';
          questionText.style.textAlign = 'center';
          questionText.style.padding = '0.5rem 0';
        } else {
          questionText.style.fontSize = '';
          questionText.style.color = '';
          questionText.style.textShadow = '';
          questionText.style.textAlign = '';
          questionText.style.padding = '';
        }

        optionsGrid.innerHTML = '';
        var shuffled = shuffleArray(q.options.slice());
        shuffled.forEach(function(opt) {
          var btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.dataset.label = opt.label;
          btn.innerHTML = '<span class="option-letter">' + opt.label + '</span><span>' + opt.text + '</span>';
          btn.addEventListener('click', function(e) {
            if (isTransitioning) return;
            isTransitioning = true;
            // Explosion
            var rect = btn.getBoundingClientRect();
            createPixelExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);
            // Score
            var w = q.w[opt.label];
            if (w) { totalF += w.f; totalM += w.m; }
            // Disable all options
            var allBtns = optionsGrid.querySelectorAll('.option-btn');
            for (var b = 0; b < allBtns.length; b++) { allBtns[b].classList.add('is-disabled'); }
            // Advance
            setTimeout(function() {
              if (index + 1 < questions.length) {
                // Slide out
                questionSlide.classList.remove('is-active');
                questionSlide.classList.add('is-exit-left');
                setTimeout(function() {
                  renderQuestion(index + 1);
                  questionSlide.classList.remove('is-exit-left');
                  setTimeout(function() { questionSlide.classList.add('is-active'); isTransitioning = false; }, 30);
                }, 300);
              } else {
                // Quiz done - show result
                showResult();
              }
            }, 600);
          });
          optionsGrid.appendChild(btn);
        });
      }

      // ===== SHOW RESULT =====
      function showResult() {
        quizModal.classList.remove('is-open');
        setTimeout(function() {
          var total = totalF + totalM;
          var pF = total > 0 ? Math.round((totalF / total) * 100) : 50;
          var pM = total > 0 ? Math.round((totalM / total) * 100) : 50;
          // Normalize to 100
          if (pF + pM !== 100) {
            if (pF > pM) pF = 100 - pM;
            else pM = 100 - pF;
          }

          var profile = '';
          var desc = '';
          if (pF >= 70) {
            profile = '🌸 软萌甜妹';
            desc = '你的灵魂里住着一位穿着粉色连衣裙、在花园里喝下午茶的小公主。温柔、细腻、感性——你是那种会让世界变得更柔软的人。';
          } else if (pF >= 50) {
            profile = '🌿 知性姐姐';
            desc = '你兼具感性与理性，像一杯恰到好处的抹茶拿铁——既有温柔的甜，也有清醒的苦。你的气质里藏着一种让人安心的力量。';
          } else if (pM >= 70) {
            profile = '🔥 硬核大佬';
            desc = '你的气场全开，像一台精密运转的超级计算机。理性、果断、不拘小节——你是那种能把实验室变成战场的人。';
          } else if (pM >= 50) {
            profile = '⚡ 潇洒酷盖';
            desc = '你随性又自信，像一阵来去自由的风。不喜欢被定义，但你的每一个选择都在说：我就是我，不一样的烟火。';
          } else {
            profile = '🌀 混沌哲学家';
            desc = '你超越了二元对立的框架，活在自己的维度里。你的气质无法被简单归类——而这恰恰是你最迷人的地方。';
          }

          resultTitle.textContent = profile;
          resultSubtitle.textContent = 'Vibe Profile';
          resultDesc.textContent = desc;
          statFemale.textContent = pF + '%';
          statMale.textContent = pM + '%';

          resultScreen.classList.add('is-open');
          // Auto-open treasure box after a beat
          setTimeout(function() {
            treasureBox.classList.add('is-open');
            treasureLid.classList.add('is-open');
            treasureGlow.classList.add('is-open');
            treasureBox.textContent = '★';
          }, 500);
        }, 400);
      }

      // ===== HUMOR POPUP =====
      resultHumorBtn.addEventListener('click', function() {
        humorPopup.classList.add('is-open');
      });
      humorCloseBtn.addEventListener('click', function() {
        humorPopup.classList.remove('is-open');
      });
      humorPopup.addEventListener('click', function(e) {
        if (e.target === humorPopup) humorPopup.classList.remove('is-open');
      });

      // ===== START QUIZ =====
      startBtn.addEventListener('click', function() {
        landing.classList.add('is-hidden');
        setTimeout(function() {
          currentQ = 0; totalF = 0; totalM = 0; isTransitioning = false;
          renderQuestion(0);
          questionSlide.classList.add('is-active');
          quizModal.classList.add('is-open');
        }, 500);
      });

      // ===== CLOSE MODAL =====
      modalClose.addEventListener('click', function() {
        quizModal.classList.remove('is-open');
        landing.classList.remove('is-hidden');
      });
      quizModal.addEventListener('click', function(e) {
        if (e.target === quizModal) {
          quizModal.classList.remove('is-open');
          landing.classList.remove('is-hidden');
        }
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          if (humorPopup.classList.contains('is-open')) {
            humorPopup.classList.remove('is-open');
          } else if (resultScreen.classList.contains('is-open')) {
            resultScreen.classList.remove('is-open');
            landing.classList.remove('is-hidden');
          } else if (quizModal.classList.contains('is-open')) {
            quizModal.classList.remove('is-open');
            landing.classList.remove('is-hidden');
          }
        }
      });

    })();
  </script>
</body>
</html>
